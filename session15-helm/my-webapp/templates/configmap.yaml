apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "my-webapp.fullname" . }}-config
  labels:
    {{- include "my-webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>{{ .Values.config.environment | title }} - Helm App</title></head>
    <body style="font-family: sans-serif; text-align: center; padding: 50px;">
      <h1>{{ .Values.config.welcomeMessage }}</h1>
      <p>Environment: <strong>{{ .Values.config.environment }}</strong></p>
      <p>Chart Version: {{ .Chart.Version }} | App Version: {{ .Chart.AppVersion }}</p>
    </body>
    </html>
