apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-nodeport-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-nodeport
  template:
    metadata:
      labels:
        app: web-nodeport
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport-svc
spec:
  type: NodePort
  selector:
    app: web-nodeport
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31080  # Accessible on <NodeIP>:31080
