apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-lb-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-lb
  template:
    metadata:
      labels:
        app: api-lb
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-lb-svc
spec:
  type: LoadBalancer  # Integrates with cloud provider or metallb/minikube tunnel
  selector:
    app: api-lb
  ports:
  - port: 80
    targetPort: 80
