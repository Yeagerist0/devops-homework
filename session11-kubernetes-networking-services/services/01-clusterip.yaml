apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-clusterip-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-internal
  template:
    metadata:
      labels:
        app: backend-internal
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-clusterip-svc
spec:
  type: ClusterIP  # Default: internal virtual IP only accessible within cluster
  selector:
    app: backend-internal
  ports:
  - port: 80
    targetPort: 80
