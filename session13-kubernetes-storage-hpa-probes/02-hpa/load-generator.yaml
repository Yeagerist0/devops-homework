apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
spec:
  template:
    spec:
      containers:
      - name: load-generator
        image: busybox:1.36
        command: ["/bin/sh", "-c", "while true; do wget -q -O- http://php-apache; done"]
      restartPolicy: Never
  backoffLimit: 2
