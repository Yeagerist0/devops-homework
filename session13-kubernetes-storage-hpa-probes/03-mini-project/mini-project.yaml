apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilient-webapp
  labels:
    app: resilient-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilient-webapp
  template:
    metadata:
      labels:
        app: resilient-webapp
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "300m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html/uploads
        # Startup Probe (for slow booting apps)
        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 30
          periodSeconds: 2
        # Liveness Probe (restarts container if deadlocked)
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        # Readiness Probe (removes pod from Service endpoints if unready)
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: app-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: resilient-webapp-svc
spec:
  selector:
    app: resilient-webapp
  ports:
  - port: 80
    targetPort: 80
