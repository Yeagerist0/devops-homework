apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-nginx-deploy
  labels:
    app: basic-nginx
    session: "09"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basic-nginx
  template:
    metadata:
      labels:
        app: basic-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
