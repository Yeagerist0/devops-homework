name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: devops-cicd-demo-app
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # CI STAGE: LINT, TEST, BUILD ARTIFACTS
  # ==========================================
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session16-cicd-github-actions/app
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: session16-cicd-github-actions/app/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Automated Unit Tests
        run: npm test

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: session16-cicd-github-actions/app/test.js

  # ==========================================
  # DOCKER BUILD & CONTAINER PACKAGING
  # ==========================================
  build-container:
    needs: test-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session16-cicd-github-actions/app
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: session16-cicd-github-actions/app
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ==========================================
  # CD STAGE: CONTINUOUS DEPLOYMENT
  # ==========================================
  deploy:
    needs: build-container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging / Production
        run: |
          echo "Simulating deployment with commit: ${{ github.sha }}"
          echo "Target Environment: production"
          echo "Deployment succeeded!"
