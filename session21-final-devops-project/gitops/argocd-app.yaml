apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-capstone-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Yeagerist0/devops-homework.git
    targetRevision: HEAD
    path: session21-final-devops-project/helm/enterprise-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
