apiVersion: v1
kind: Pod
metadata:
  name: init-demo-pod
  labels:
    app: lifecycle-demo
spec:
  initContainers:
  - name: init-myservice
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Initializing application environment..." && sleep 3 && echo "Init completed successfully" > /work-dir/initialized.txt']
    volumeMounts:
    - name: workdir
      mountPath: /work-dir
  containers:
  - name: main-app
    image: nginx:alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: workdir
      mountPath: /usr/share/nginx/html
  volumes:
  - name: workdir
    emptyDir: {}
